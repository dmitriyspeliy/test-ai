spring:
  application:
    name: task-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_manager}
    username: ${SPRING_DATASOURCE_USERNAME:task_manager}
    password: ${SPRING_DATASOURCE_PASSWORD:task_manager}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  uploads:
    max-file-size-bytes: ${APP_UPLOADS_MAX_FILE_SIZE_BYTES:10485760}
    max-files-per-task: ${APP_UPLOADS_MAX_FILES_PER_TASK:10}
