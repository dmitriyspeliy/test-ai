services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/dmitriyspeliy/test-ai-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/task_manager}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-task_manager}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://80.74.31.96:3000}
      APP_UPLOADS_MAX_FILE_SIZE_BYTES: ${APP_UPLOADS_MAX_FILE_SIZE_BYTES:-10485760}
      APP_UPLOADS_MAX_FILES_PER_TASK: ${APP_UPLOADS_MAX_FILES_PER_TASK:-10}
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/dmitriyspeliy/test-ai-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://80.74.31.96:8081}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
